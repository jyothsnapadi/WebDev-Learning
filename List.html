<html>

<head>

</head>

<body>
    <ol type="a">
        <li>list 1</li>
        <li>list 2</li>
        <li>list 3</li>
    </ol>
    <ul type="square">
        <li>list 1</li>
        <li>list 2</li>
        <ol type="a">
            <li>list 1</li>

            <li>list 3</li>

        <dt>term2</dt>
        <dd>description 2</dd>
    </dl>
</body>

</html>
