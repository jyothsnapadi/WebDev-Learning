<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form>
        <label for="firstnameid">FIRSTNAME</label>
        <input type="text"  tabindex="0"autocomplete="on" name="firstname " id="firstnameid" placeholder="enter your name"
            required />
        <input type="email" tabindex="0" name="email" id="emailid" reqired />
        <input type="number" tabindex="0" min="18" max="90" name="age" id="ageid " reqired />
        <input type="tel" tabindex="2"  pattern="[0-9]{10}" name="number" id="numberid" required />
        <input type="date" name="date" id="dateid" />
        <input type="datetime-local" name="dateand time" id="dateand timeid" />
        <p contenteditable="true">this is a paragraph</p>
        
        <select>
            <optgroup>
                <option value="java full stack">java full stack</option>
                <option value=".net full stack">.net full stack</option>
                <option value="python full stack">python full stack</option>
                <option value="mern full stack">mern full stack</option>
            </optgroup>
        </select>
<input list="courses"/>
        <datalist id="courses">
            <option value="java full stack">java full stack</option>
            <option value=".net full stack">.net full stack</option>
            <option value="python full stack">python full stack</option>
            <option value="mern full stack">mern full stack</option>
        </datalist>

        <button>submit</button>
    </form>
    
</body>

</html>
